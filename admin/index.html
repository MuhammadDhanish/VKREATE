<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VKREATE — Admin Panel</title>
  <meta name="description" content="VKREATE Design Studio admin dashboard — manage projects, reviews, and inquiries.">
  <link rel="icon" type="image/png" href="../assets/images/logo.png">
  <link rel="apple-touch-icon" href="../assets/images/logo.png">
  <meta name="robots" content="noindex, nofollow">
  <base href="/admin/">
  <link rel="stylesheet" href="css/admin.css">

</head>
<body>

<div id="admin-app">
  <!-- Filled by JS -->
</div>

<div id="toast-container"></div>

<!-- ── Utilities ──────────────────────────────────────────── -->
<script>
const UI = {

  // ── HTML Escaping ─────────────────────────────────────────
  escapeHTML(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  },

  // ── Toast notifications ───────────────────────────────────
  toast(message, type = 'info') {
    const tc = document.getElementById('toast-container');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    const icons = { success: '✓', error: '✕', warning: '⚠', info: 'ℹ' };
    el.innerHTML = `<span class="toast-icon">${icons[type]||'ℹ'}</span><span>${message}</span>`;
    tc.appendChild(el);
    setTimeout(() => {
      el.classList.add('out');
      setTimeout(() => el.remove(), 300);
    }, 3500);
  },

  // ── Confirmation modal ────────────────────────────────────
  confirm(title, message, icon = '❓', onConfirm, danger = false) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal" style="max-width:420px">
        <div class="modal__body" style="padding:32px 24px;text-align:center">
          <div class="confirm-icon">${icon}</div>
          <div class="confirm-title">${title}</div>
          <p class="confirm-text mt-8">${message}</p>
        </div>
        <div class="modal__footer" style="justify-content:center;gap:12px">
          <button class="btn btn-outline" id="conf-cancel">Cancel</button>
          <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="conf-ok">
            ${danger ? '🗑️ Delete' : 'Confirm'}
          </button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('#conf-cancel').onclick = () => overlay.remove();
    overlay.querySelector('#conf-ok').onclick = () => { overlay.remove(); onConfirm(); };
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  },

  // ── Modal ─────────────────────────────────────────────────
  modal(title, body, footer = '', sizeClass = '') {
    this.closeModal();
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'active-modal';
    overlay.innerHTML = `
      <div class="modal ${sizeClass}">
        <div class="modal__header">
          <h2 class="modal__title">${title}</h2>
          <button class="modal__close" onclick="UI.closeModal()" aria-label="Close">✕</button>
        </div>
        <div class="modal__body">${body}</div>
        ${footer ? `<div class="modal__footer" style="display:flex;gap:10px">${footer}</div>` : ''}
      </div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', e => { if (e.target === overlay) this.closeModal(); });
    document.addEventListener('keydown', UI._escClose);
  },

  _escClose(e) { if (e.key === 'Escape') UI.closeModal(); },

  closeModal() {
    const m = document.getElementById('active-modal');
    if (m) { m.remove(); document.removeEventListener('keydown', UI._escClose); }
  },

  // ── Badge ─────────────────────────────────────────────────
  badge(status) {
    const map = {
      published: ['badge-success', 'Published'],
      draft:     ['badge-gray',    'Draft'],
      pending:   ['badge-warning', 'Pending'],
      approved:  ['badge-success', 'Approved'],
      rejected:  ['badge-danger',  'Rejected'],
      new:       ['badge-info',    'New'],
      contacted: ['badge-gold',    'Contacted'],
      quoted:    ['badge-warning', 'Quoted'],
      won:       ['badge-success', 'Won'],
      lost:      ['badge-danger',  'Lost'],
    };
    const [cls, label] = map[status] || ['badge-gray', status];
    return `<span class="badge ${cls}">${label}</span>`;
  },

  // ── Icons (inline SVG) ────────────────────────────────────
  icon(name, cls = '') {
    const icons = {
      plus:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>`,
      check:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>`,
      search:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>`,
      download: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`,
      chart:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>`,
      menu:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>`,
    };
    const svg = icons[name] || '';
    return `<svg class="${cls}" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${svg.replace(/<svg[^>]*>/,'').replace('</svg>','')}</svg>`;
  },

  // ── Time helpers ──────────────────────────────────────────
  timeAgo(dateStr) {
    if (!dateStr) return '—';
    const diff = Date.now() - new Date(dateStr);
    const mins  = Math.floor(diff / 60000);
    const hours = Math.floor(diff / 3600000);
    const days  = Math.floor(diff / 86400000);
    if (mins < 2)    return 'just now';
    if (mins < 60)   return `${mins}m ago`;
    if (hours < 24)  return `${hours}h ago`;
    if (days < 30)   return `${days}d ago`;
    return this.dateShort(dateStr);
  },

  dateShort(dateStr) {
    if (!dateStr) return '—';
    return new Date(dateStr).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
  },

  // ── CSV Download ──────────────────────────────────────────
  downloadCSV(rows, filename) {
    const csv = rows.map(r => r.join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    UI.toast('CSV downloaded!', 'success');
  },
};
</script>

<!-- ── Firebase SDKs & Configuration ───────────────────────── -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
<script src="../js/firebase-config.js"></script>

<!-- ── Image Storage (IndexedDB) ──────────────────────────── -->
<script src="js/imagedb.js?v=20260822_v20"></script>
<!-- ── GitHub Sync Engine ─────────────────────────────────── -->
<script src="js/github-sync.js?v=20260822_v20"></script>
<!-- ── Data layer ──────────────────────────────────────────── -->
<script src="js/data.js?v=20260822_v20"></script>
<!-- ── Feature modules ────────────────────────────────────── -->
<script src="js/auth.js?v=20260822_v20"></script>
<script src="js/dashboard.js?v=20260822_v20"></script>
<script src="js/projects.js?v=20260822_v20"></script>
<script src="js/reviews.js?v=20260822_v20"></script>
<script src="js/inquiries.js?v=20260822_v20"></script>
<script src="js/settings.js?v=20260822_v20"></script>

<!-- ── App Shell & Router ──────────────────────────────────── -->
<script>
const PAGES = {
  dashboard:    { label: 'Dashboard',  module: Dashboard,  icon: '🏠' },
  projects:     { label: 'Projects',   module: Projects,   icon: '🏗️' },
  'projects-add': { label: 'Add Project', module: null,    icon: '' },
  reviews:      { label: 'Reviews',    module: Reviews,    icon: '⭐' },
  inquiries:    { label: 'Inquiries',  module: Inquiries,  icon: '📬' },
  settings:     { label: 'Settings',   module: Settings,   icon: '⚙️' },
};

const NAV_ITEMS = [
  { group: 'Main' },
  { page: 'dashboard',  label: 'Dashboard',  icon: dashboardIcon() },
  { group: 'Content' },
  { page: 'projects',   label: 'Projects',   icon: projectsIcon() },
  { page: 'reviews',    label: 'Reviews',    icon: reviewsIcon(),   badge: () => DB.reviews.stats().pending },
  { page: 'inquiries',  label: 'Inquiries',  icon: inquiriesIcon(), badge: () => DB.inquiries.stats().new },
  { group: 'System' },
  { page: 'settings',   label: 'Settings',   icon: settingsIcon() },
];

function dashboardIcon()  { return `<svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>`; }
function projectsIcon()   { return `<svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 6l10-4 10 4v2L12 12 2 8V6z"/><path d="M2 12l10 4 10-4"/><path d="M2 18l10 4 10-4"/></svg>`; }
function reviewsIcon()    { return `<svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`; }
function inquiriesIcon()  { return `<svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>`; }
function settingsIcon()   { return `<svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>`; }

const App = {
  _current: 'dashboard',

  async init() {
    DB.seed();
    if (!DB.auth.session.isValid()) {
      Auth.renderLogin();
      return;
    }
    try {
      if (typeof DB.loadRemoteData === 'function') {
        await DB.loadRemoteData();
      }
    } catch (e) {}

    try {
      this._renderShell();
      const hash = location.hash.slice(1) || 'dashboard';
      this.navigate(hash);
    } catch (err) {
      console.warn('Dashboard render recovery:', err);
      const appEl = document.getElementById('admin-app');
      if (appEl) {
        appEl.innerHTML = `
          <div class="login-page">
            <div class="login-card" style="max-width:480px;text-align:center;padding:36px;">
              <div style="font-size:2.5rem;margin-bottom:12px">⚠️</div>
              <h2 class="login-title" style="margin-bottom:8px">Something went wrong</h2>
              <p style="color:var(--text-3);font-size:0.875rem;line-height:1.5;margin-bottom:24px">
                An unexpected rendering error occurred. Your admin session is still intact.
              </p>
              <button type="button" class="btn btn-primary" onclick="App.init()" style="padding:10px 24px;cursor:pointer">🔄 Retry Loading Admin</button>
            </div>
          </div>`;
      }
    }
    window.addEventListener('hashchange', () => this.navigate(location.hash.slice(1)));
  },

  _renderShell() {
    const session = DB.auth.session.get();
    const emailStr = (session && typeof session.email === 'string' && session.email.includes('@')) ? session.email : 'Admin@vkreate.com';
    const initials = emailStr.split('@')[0].slice(0, 2).toUpperCase();

    document.getElementById('admin-app').innerHTML = `
      <!-- Mobile overlay -->
      <div class="sidebar-overlay" id="sb-overlay" onclick="App.closeSidebar()"></div>

      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar" role="navigation" aria-label="Admin navigation">
        <div class="sidebar__brand">
          <div class="sidebar__logo">VKREATE</div>
          <div class="sidebar__tagline">Design Studio</div>
          <span class="sidebar__badge">Admin Panel</span>
        </div>

        <nav class="sidebar__nav">
          ${NAV_ITEMS.map(item => {
            if (item.group) return `<div class="sidebar__section-label">${item.group}</div>`;
            const badge = item.badge ? item.badge() : 0;
            return `
              <a href="#${item.page}" class="nav-item" data-page="${item.page}">
                ${item.icon}
                <span>${item.label}</span>
                ${badge ? `<span class="nav-item__badge">${badge}</span>` : ''}
              </a>
            `;
          }).join('')}
        </nav>

        <div class="sidebar__footer">
          <div class="sidebar__user">
            <div class="sidebar__avatar">${initials}</div>
            <div class="sidebar__user-info">
              <div class="sidebar__user-name">VKREATE Admin</div>
              <div class="sidebar__user-role">${UI.escapeHTML(emailStr)}</div>
            </div>
          </div>
          <button class="btn btn-ghost btn-icon w-full mt-12" onclick="Auth.logout()" style="justify-content:flex-start;gap:8px" title="Sign Out">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span>Sign Out</span>
          </button>
        </div>
      </aside>

      <!-- Main Layout -->
      <div class="main-wrap">
        <!-- Header -->
        <header class="header" role="banner">
          <div class="header__left">
            <button type="button" class="btn btn-ghost btn-icon sidebar-toggle" onclick="App.openSidebar()" aria-label="Open navigation menu">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <div class="header__breadcrumb">
              <span>Admin</span>
              <span>/</span>
              <span id="header-page">Dashboard</span>
            </div>
          </div>

          <div class="header__right">
            <button type="button" class="header__icon-btn" onclick="location.hash='reviews'" title="Pending Client Reviews" aria-label="View Pending Client Reviews">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
              <span class="header__notif-dot" style="display:${DB.reviews.stats().pending ? 'block' : 'none'}"></span>
            </button>
            <a href="../index.html" target="_blank" class="btn btn-ghost btn-sm" style="display:inline-flex;align-items:center;gap:6px">
              <span>Live Site</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15,3 21,3 21,9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            </a>
          </div>
        </header>

        <!-- Main Content -->
        <main class="main-content" id="main-content" role="main">
          <!-- Page modules render here -->
        </main>
      </div>
    `;

    this.updateSidebar();
  },

  navigate(page) {
    if (typeof DB !== 'undefined' && DB.auth && DB.auth.session) {
      DB.auth.session.touch();
    }

    if (!page || !PAGES[page]) page = 'dashboard';

    const session = DB.auth.session.get();
    if (!DB.auth.session.isValid()) {
      Auth.renderLogin();
      return;
    }

    // Special: projects-add opens modal instead of own page
    if (page === 'projects-add') {
      this.navigate('projects');
      setTimeout(() => Projects.openForm(), 100);
      return;
    }

    const isPageChange = (this._current !== page);
    this._current = page;
    location.hash = page;

    // Update nav active state
    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.toggle('active', el.dataset.page === page);
    });

    // Update breadcrumb
    const bp = document.getElementById('header-page');
    if (bp) bp.textContent = PAGES[page]?.label || page;

    // Re-render content
    const content = document.getElementById('main-content');
    const mod = PAGES[page]?.module;
    if (mod && typeof mod.render === 'function') {
      if (content && isPageChange) {
        content.style.animation = 'none';
        void content.offsetWidth;
        content.style.animation = 'fadeInUp 0.3s var(--ease) both';
      }
      mod.render();
    }
  },

  updateSidebar() {
    // Refresh badges
    document.querySelectorAll('.nav-item').forEach(el => {
      const page = el.dataset.page;
      const item = NAV_ITEMS.find(n => n.page === page);
      if (item?.badge) {
        const cnt = item.badge();
        let badge = el.querySelector('.nav-item__badge');
        if (cnt) {
          if (!badge) { badge = document.createElement('span'); badge.className = 'nav-item__badge'; el.appendChild(badge); }
          badge.textContent = cnt;
        } else if (badge) {
          badge.remove();
        }
      }
    });

    // Refresh notification dot in header
    const btn = document.querySelector('.header__notif-dot');
    if (btn) btn.style.display = DB.reviews.stats().pending ? 'block' : 'none';
  },

  openSidebar() {
    document.getElementById('sidebar')?.classList.add('open');
    document.getElementById('sb-overlay')?.classList.add('show');
  },
  closeSidebar() {
    document.getElementById('sidebar')?.classList.remove('open');
    document.getElementById('sb-overlay')?.classList.remove('show');
  },
  _refreshCurrentView() {
    this.updateSidebar();
    const page = this._current || 'dashboard';

    // NEVER auto-wipe & re-render Settings on background sync/focus events!
    if (page === 'settings') {
      return;
    }

    // Prevent view re-rendering if a modal overlay is active
    if (document.querySelector('.modal-overlay, #admin-add-review-modal, #admin-project-modal, #modal-overlay')) {
      return;
    }

    // Prevent background sync from wiping form inputs while user is actively typing
    if (document.activeElement && ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName) && document.activeElement.value !== '') {
      return;
    }

    const mod = PAGES[page]?.module;
    if (!mod) return;

    // For Reviews page: if any button is stuck in [data-loading="true"], force full render to self-heal
    if (page === 'reviews') {
      const listEl = document.getElementById('reviews-list');
      if (listEl && listEl.querySelector('[data-loading="true"]')) {
        if (typeof mod.render === 'function') mod.render();
        return;
      }
      if (listEl && typeof mod._refreshCards === 'function') {
        mod._refreshCards();
        if (typeof mod._refreshTabState === 'function') mod._refreshTabState();
        return;
      }
    }

    if (typeof mod.render === 'function') {
      mod.render();
    }
  }
};

// ── Sync Event Listeners ────────────────────────────────────
// Use a debounce flag to prevent double-renders when multiple events fire together
let _syncRefreshPending = false;
function _scheduleSyncRefresh() {
  if (_syncRefreshPending) return;
  _syncRefreshPending = true;
  requestAnimationFrame(() => {
    _syncRefreshPending = false;
    App._refreshCurrentView();
  });
}
['vkreate:projects-updated', 'vkreate:reviews-updated', 'vkreate:inquiries-updated', 'vkreate:settings-updated', 'storage'].forEach(evt => {
  window.addEventListener(evt, _scheduleSyncRefresh);
});

window.addEventListener('focus', () => {
  if (typeof DB !== 'undefined' && DB.auth && DB.auth.session && DB.auth.session.isValid()) {
    DB.auth.session.touch();
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && typeof DB !== 'undefined' && DB.auth && DB.auth.session && DB.auth.session.isValid()) {
    DB.auth.session.touch();
  }
});

// ── Boot ────────────────────────────────────────────────────
App.init();

// ── Script Self-Test ────────────────────────────────────────
setTimeout(() => {
  const appEl = document.getElementById('admin-app');
  if (appEl && !appEl.innerHTML.trim()) {
    appEl.innerHTML = `
      <div style="position:fixed;inset:0;background:#0f172a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;z-index:999999;padding:20px;text-align:center;">
        <h2 style="margin-bottom:12px;">⚠️ Admin Panel Failed to Load Scripts</h2>
        <p style="color:#94a3b8;max-width:440px;margin-bottom:20px;line-height:1.5;">Admin panel failed to load its scripts. Hard-refresh with Ctrl+Shift+R.</p>
        <button onclick="location.reload(true)" style="background:#2563eb;color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-weight:600;">Hard Refresh Page</button>
      </div>
    `;
  }
}, 3000);
</script>
</body>
</html>
